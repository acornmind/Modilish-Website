# /etc/nginx/sites-available/modilish — reverse proxy in front of `next start`.
#
# Stage 1 (before the modilish.com cutover): every hostname serves the app so the
# new site can be previewed on real domains. After the cutover, the non-canonical
# names (www, nafisfabric.com, app.modilish.com) become 301 redirects to
# https://modilish.com. certbot --nginx adds the TLS blocks.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name modilish.com www.modilish.com nafisfabric.com www.nafisfabric.com app.modilish.com _;

    client_max_body_size 20m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
    }
}
