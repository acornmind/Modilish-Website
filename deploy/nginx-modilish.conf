# /etc/nginx/sites-available/modilish
# modilish.com is canonical; every other hostname redirects to it. Redirects live
# inside `location /` (not at server level) so certbot's ACME challenge location
# still wins during certificate renewals. Certificate: certbot --nginx, one
# lineage ("modilish.com") covering all five names, auto-renewed by certbot.timer.

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name modilish.com;

    ssl_certificate /etc/letsencrypt/live/modilish.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/modilish.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 20m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
    }
}

# www, nafisfabric.com and the old preview name -> canonical
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.modilish.com nafisfabric.com www.nafisfabric.com app.modilish.com;

    ssl_certificate /etc/letsencrypt/live/modilish.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/modilish.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        return 301 https://modilish.com$request_uri;
    }
}

# plain HTTP (any hostname, including the bare IP) -> HTTPS canonical
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name modilish.com www.modilish.com nafisfabric.com www.nafisfabric.com app.modilish.com _;

    location / {
        return 301 https://modilish.com$request_uri;
    }
}
