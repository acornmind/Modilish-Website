# /etc/nginx/sites-available/postgrest-internal — loopback only.
# supabase-js appends /rest/v1 to NEXT_PUBLIC_SUPABASE_URL; PostgREST serves at
# its root, so this strips the prefix. Never exposed publicly.
server {
    listen 127.0.0.1:8000;

    location /rest/v1/ {
        proxy_pass http://127.0.0.1:3001/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }
}
